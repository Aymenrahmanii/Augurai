name: augurai

on:
  schedule:
    - cron: "30 4 * * *" # morning run: 05:30 Tunis, writes the daily briefing
    - cron: "0 10,16,22 * * *" # refresh runs
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [refresh, morning]
        default: refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: augurai
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always start from the branch head, never the event SHA: a re-run of an old run must
      # see the briefing already written for today, or it would replace it with an empty one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Pick the mode
        run: |
          if [ "${{ github.event.schedule }}" = "30 4 * * *" ] || [ "${{ inputs.mode }}" = "morning" ]; then
            echo "MODE=morning" >> "$GITHUB_ENV"
          else
            echo "MODE=refresh" >> "$GITHUB_ENV"
          fi

      - name: Collect
        run: uv run augurai collect --mode "$MODE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Snapshot state before Claude runs
        if: env.MODE == 'morning' && hashFiles('work/enrich_input.json') != ''
        run: |
          rm -rf "$RUNNER_TEMP/before" && mkdir -p "$RUNNER_TEMP/before"
          cp -r data "$RUNNER_TEMP/before/data"
          [ -d briefings ] && cp -r briefings "$RUNNER_TEMP/before/briefings" || true

      - name: Enrich with Claude
        if: env.MODE == 'morning' && hashFiles('work/enrich_input.json') != ''
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in prompts/enrich.md exactly. Read work/enrich_input.json and write work/enrich_output.json."
          # Claude reads untrusted web text: it may read the prompt and the input, and write one file.
          claude_args: '--allowedTools "Read(prompts/enrich.md),Read(work/**),Write(work/enrich_output.json)" --max-turns 15'

      # The next step runs this repository's code with mail secrets, so undo anything Claude
      # might have written outside work/ (a tampered prompt, source file or data file).
      - name: Discard changes made outside work/
        if: env.MODE == 'morning' && hashFiles('work/enrich_input.json') != ''
        run: |
          git checkout HEAD -- src prompts scripts config .github pyproject.toml uv.lock
          git clean -fdq src prompts scripts config .github
          if [ -d "$RUNNER_TEMP/before/data" ]; then
            rm -rf data && cp -r "$RUNNER_TEMP/before/data" data
          fi
          if [ -d "$RUNNER_TEMP/before/briefings" ]; then
            rm -rf briefings && cp -r "$RUNNER_TEMP/before/briefings" briefings
          fi

      - name: Finish (briefing and site)
        run: uv run augurai finish --mode "$MODE"

      - name: Commit data
        run: |
          mkdir -p briefings
          git config user.name "augurai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data briefings
          git diff --cached --quiet || git commit -m "chore(data): update $(date -u +%FT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}" || true
            git push && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
