<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Augurai{% endblock %}</title>
  <meta name="description" content="Augurai tracks AI models, benchmarks, projects, people and jobs, and turns them into a daily briefing.">
  <script>
    /* Apply a saved theme before first paint so there is no flash. */
    (function () { try { var t = localStorage.getItem("augurai-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ base }}static/site.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ base }}">
        <svg class="mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 20 12 4l8 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="15" r="1.8" fill="currentColor"/></svg>
        Augurai
      </a>
      <nav aria-label="Main">
        {% for key, label, path in nav %}
        <a href="{{ base }}{{ path }}"{% if key == page %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <main class="wrap" id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>{{ updated }}</p>
      <p class="credits">Data from OpenRouter, Hugging Face, GitHub, Hacker News, the MCP registry, Adzuna, RemoteOK and
        <a href="https://artificialanalysis.ai/">Artificial Analysis</a>.</p>
    </div>
  </footer>
  <script src="{{ base }}static/filter.js" defer></script>
</body>
</html>
