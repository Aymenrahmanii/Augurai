# Augurai settings. Seed people and their verified links come from docs/sources.md.

timezone = "Africa/Tunis"
briefing_hour_local = 7
site_url = "https://aymenrahmanii.github.io/Augurai/"
site_base_path = "/Augurai/"

github_topics = ["llm", "ai-agents", "mcp", "claude-code", "rag", "llmops"]
hn_queries = ["LLM", "AI agent", "Claude", "GPT", "MCP", "open-weights"]
hn_min_points = 100

feeds = [
  "https://www.latent.space/feed",
  "https://simonwillison.net/atom/everything/",
  "https://openai.com/news/rss.xml",
  "https://deepmind.google/blog/rss.xml",
  "https://mistral.ai/rss.xml",
  "https://qwenlm.github.io/blog/index.xml",
]

rising_top_n = 10
promote_threshold = 5.0
promote_consecutive_runs = 2
dormant_days = 90
max_enrich_items = 60

job_keywords = ["LLM", "RAG", "agents", "MCP", "fine-tuning", "evals", "MLOps", "PyTorch", "LangChain", "vector database"]
adzuna_country = "fr"
# Tunisia job board dropped: robots.txt disallows keyword search (see docs/sources.md).
# tn_job_board = "tanitjobs"

[[seed_people]]
id = "matt-pocock"
name = "Matt Pocock"
why_follow = "Turns TypeScript and AI-assisted coding into small, repeatable workflows."
what_to_learn = "Grill the idea before building; write specs, split into tickets, test-first loops."
links = { github = "https://github.com/mattpocock", web = "https://aihero.dev", rss = "https://www.aihero.dev/rss.xml" }

